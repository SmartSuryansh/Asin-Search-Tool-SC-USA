<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASIN Decision Engine — SmartSign SP</title><style>
:root{--navy:#0e1b2e;--navy2:#16233f;--teal:#1c7293;--ice:#cadcfc;--green:#2f9e44;--red:#c92a2a;--gold:#c08a1e;--blue:#2d7dd2;--slate:#64748b;--bg:#f4f7fb;--card:#fff;--line:#e3e9f2;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
body{background:var(--bg);color:#1a2233;}
header{background:linear-gradient(120deg,var(--navy),var(--teal));color:#fff;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
header h1{font-size:19px;font-weight:800;}header .fresh{color:var(--ice);font-size:11.5px;text-align:right;}
.tabs{display:flex;gap:6px;background:var(--navy2);padding:0 26px;}
.tab{padding:11px 20px;color:#9fb3d8;font-size:13px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;}
.tab.on{color:#fff;border-color:var(--ice);}
.wrap{max-width:1080px;margin:0 auto;padding:16px 20px 60px;}
#q,#bq{width:100%;padding:14px 17px;font-size:16px;border:2px solid var(--teal);border-radius:11px;outline:none;}
#bq{min-height:120px;font-family:ui-monospace,monospace;font-size:13px;resize:vertical;}
.hint{color:var(--slate);font-size:12px;margin:6px 2px 0;}
.row{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 13px;margin-top:7px;cursor:pointer;display:flex;gap:10px;align-items:center;}
.row:hover{border-color:var(--teal);}.row .asin{font-family:ui-monospace,monospace;font-weight:700;font-size:13px;color:var(--navy);min-width:108px;}
.row .rt{flex:1;font-size:12px;color:#445;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip{font-size:10px;font-weight:800;color:#fff;padding:3px 8px;border-radius:16px;white-space:nowrap;letter-spacing:.3px;}
.b-Top{background:var(--green);}.b-Opportunity{background:var(--gold);}.b-Paused{background:var(--slate);}.b-Whitespace{background:#8595ad;}.b-Notinscope{background:#9aa3b2;}.mixchip{background:var(--blue);}
.detail{background:var(--card);border:1px solid var(--line);border-radius:15px;margin-top:12px;overflow:hidden;box-shadow:0 8px 26px rgba(20,40,80,.08);}
.vbar{padding:16px 22px;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.v-grow{background:linear-gradient(120deg,#1a7a35,#2f9e44);}.v-fix{background:linear-gradient(120deg,#a51d1d,#c92a2a);}.v-steady{background:linear-gradient(120deg,#1a4f7a,#2d7dd2);}.v-leave{background:linear-gradient(120deg,#4a5568,#64748b);}
.vbar .vv{font-size:22px;font-weight:800;}.vbar .aa{font-family:ui-monospace,monospace;font-size:15px;font-weight:700;opacity:.9;}
.head2{padding:13px 22px;background:#f8fafd;border-bottom:1px solid var(--line);}
.head2 .tt{font-size:13px;color:#445;margin-bottom:8px;}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.reply{margin:16px 22px;padding:15px 17px;border-left:5px solid var(--teal);background:#eef6fb;border-radius:0 9px 9px 0;}
.reply .lbl{font-size:10.5px;font-weight:800;color:var(--teal);letter-spacing:1px;}.reply .txt{font-size:14.5px;color:#12283f;margin-top:6px;line-height:1.45;}
.copybtn{margin-top:9px;font-size:12px;font-weight:700;color:#fff;background:var(--teal);border:none;padding:6px 12px;border-radius:6px;cursor:pointer;}
.rc{margin:0 22px 12px;}.rc .t{font-size:10px;color:var(--slate);font-weight:800;letter-spacing:.5px;margin-bottom:4px;}
.rcchip{display:inline-block;font-size:10px;font-weight:700;color:#3a4a63;background:#eef2f9;border:1px solid #d7e0ee;padding:2px 8px;border-radius:5px;margin:0 4px 4px 0;}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:0 22px 8px;}
.sc{background:#f5f8fc;border:1px solid var(--line);border-radius:9px;padding:9px 10px;}.sc .v{font-size:16px;font-weight:800;color:var(--navy);}.sc .k{font-size:10px;color:var(--slate);margin-top:2px;}
.cp{margin:6px 22px 12px;font-size:12px;color:#445;}.cp b{color:var(--navy);}
.chart{padding:6px 22px 20px;}.chart h4{font-size:12px;color:var(--navy);margin-bottom:6px;}.leg{font-size:10.5px;color:var(--slate);margin-bottom:6px;}.leg span{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;background:#fff;}
th{background:var(--navy);color:#fff;padding:8px;text-align:left;font-size:11px;position:sticky;top:0;}
td{padding:7px 8px;border-bottom:1px solid var(--line);}tr:hover td{background:#f5f8fc;cursor:pointer;}
.empty{color:var(--slate);text-align:center;padding:36px;font-size:14px;}
</style></head><body>
<header><h1>🔎 ASIN Decision Engine</h1><div class="fresh" id="fresh">loading data…</div></header>
<div class="tabs"><div class="tab on" id="t1" onclick="tab(1)">Single ASIN</div><div class="tab" id="t2" onclick="tab(2)">Batch (paste a list)</div></div>
<div class="wrap">
<div id="boot" style="padding:14px 2px;color:#1c7293;font-weight:700">Loading 14,536 ASINs…</div><div id="p1"><input id="q" disabled placeholder="Paste or type an ASIN …" autocomplete="off" autofocus>
<div class="hint">Badge = tier · Verdict = recommended action · reply explains the spend status (stock, listing, tier, efficiency).</div>
<div id="list"></div><div id="detail"></div></div>
<div id="p2" style="display:none"><textarea id="bq" placeholder="Paste ASINs — one per line, or comma/space separated (e.g. from an email)…"></textarea>
<div class="hint">Paste any number of ASINs → instant verdict table. Click a row to open its full card.</div><div id="btable"></div></div>
</div>
<script>
let RAW,CB,A,BE;const idx={};
fetch('data.json').then(r=>r.json()).then(d=>{RAW=d;CB=d.combos;A=d.asins;BE=d.be;A.forEach(o=>idx[o.a]=o);
  document.getElementById('fresh').innerHTML='Listings: '+d.dates.listing+' · Ads: '+d.dates.ads+' · Sales: '+d.dates.sales+'<br>Break-even ACOS: '+Math.round(d.be)+'% · '+A.length.toLocaleString()+' ASINs';
  document.getElementById('boot').style.display='none';document.getElementById('q').disabled=false;document.getElementById('q').focus();
}).catch(e=>{document.getElementById('boot').innerHTML='<b style=color:#c92a2a>Could not load data.json</b> — make sure it sits next to index.html.';});
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug"];
const money=n=>n==null?'—':'$'+Math.round(n).toLocaleString();const num=n=>n==null?'—':Math.round(n).toLocaleString();
const V=o=>CB[o.v],R=o=>CB[o.ri];
function bclass(b){return 'b-'+String(b).replace(/[\s]/g,'');}
function vclass(v){if(/SCALE|MAINTAIN|ENABLE|LAUNCH|REACTIVATE/.test(v))return'v-grow';if(/FIX|CUT|PAUSE/.test(v))return'v-fix';if(/MANAGED|HOLD/.test(v))return'v-steady';return'v-leave';}
function tab(n){document.getElementById('t1').classList.toggle('on',n==1);document.getElementById('t2').classList.toggle('on',n==2);document.getElementById('p1').style.display=n==1?'':'none';document.getElementById('p2').style.display=n==2?'':'none';}
const q=document.getElementById('q'),list=document.getElementById('list'),detail=document.getElementById('detail');
function render(res,term){if(!term){list.innerHTML='';return;}if(!res.length){list.innerHTML='<div class="empty">No ASIN found for “'+term+'”.</div>';return;}
 list.innerHTML=res.slice(0,35).map(o=>`<div class="row" onclick="show('${o.a}')"><span class="asin">${o.a}</span><span class="chip ${bclass(o.b)}">${o.b}</span>${o.m?'<span class="chip mixchip">MIX</span>':''}<span class="rt">${o.c} — ${V(o)}</span></div>`).join('');}
function search(){const t=q.value.trim().toUpperCase();if(!t){render([],'');detail.innerHTML='';return;}if(idx[t]){show(t);render([idx[t]],t);return;}const r=A.filter(o=>o.a.indexOf(t)>=0||(o.t&&o.t.toUpperCase().indexOf(t)>=0));render(r,t);if(r.length===1)show(r[0].a);}
function bar(o){const s25=o.mTS.slice(0,8),s26=o.mTS.slice(8);const mx=Math.max(1,...o.mTS);const W=640,H=120;let s=`<svg viewBox="0 0 ${W} ${H+20}" width="100%">`;for(let i=0;i<8;i++){const x=24+i*((W-24)/8),bw=(W-24)/8;s+=`<rect x="${x+bw*0.15}" y="${H-s25[i]/mx*H}" width="${bw*0.32}" height="${s25[i]/mx*H}" fill="#b7c4d9" rx="2"/><rect x="${x+bw*0.5}" y="${H-s26[i]/mx*H}" width="${bw*0.32}" height="${s26[i]/mx*H}" fill="#1c7293" rx="2"/><text x="${x+bw*0.42}" y="${H+14}" font-size="10" fill="#64748b" text-anchor="middle">${MON[i]}</text>`;}return s+'</svg>';}
function show(a){const o=idx[a];if(!o)return;const stock=o.st==null?(o.hf?'FBA (Amazon-managed)':'—'):(o.st+' units');
 detail.innerHTML=`<div class="detail">
 <div class="vbar ${vclass(V(o))}"><div><div style="font-size:11px;opacity:.85;font-family:ui-monospace,monospace">${o.a}</div><div class="vv">${V(o)}</div></div><div class="aa">${o.b}${o.m?' · MIX':''}</div></div>
 <div class="head2"><div class="tt">${o.t||''}</div><div class="chips">
   <span class="chip ${bclass(o.b)}">${o.b} tier</span>${o.m?'<span class="chip mixchip">IN MIXED</span>':''}
   <span class="chip" style="background:${o.ls=='Active'?'#2f9e44':(o.ls=='Inactive'?'#c92a2a':'#8595ad')}">${o.ls}</span>
   <span class="chip" style="background:#334">${o.f||'—'}</span>
   <span class="chip" style="background:#1c7293">Stock: ${stock}</span>${o.pr?'<span class="chip" style="background:#475">$'+o.pr+'</span>':''}</div></div>
 <div class="reply"><div class="lbl">SUGGESTED REPLY</div><div class="txt" id="rtxt">${R(o)}</div><button class="copybtn" onclick="navigator.clipboard.writeText(document.getElementById('rtxt').innerText)">Copy reply</button></div>
 ${o.rc?`<div class="rc"><div class="t">REASON CODES</div>${o.rc.split('; ').filter(Boolean).map(c=>'<span class="rcchip">'+c+'</span>').join('')}</div>`:''}
 <div class="cards">
  <div class="sc"><div class="v">${money(o.ts26)}</div><div class="k">Total Sales '26</div></div>
  <div class="sc"><div class="v">${money(o.sp)}</div><div class="k">Ad Spend '26</div></div>
  <div class="sc"><div class="v">${money(o.asl)}</div><div class="k">Ad Sales '26</div></div>
  <div class="sc"><div class="v">${o.roas?o.roas+'x':'—'}</div><div class="k">ROAS</div></div>
  <div class="sc"><div class="v">${o.acos?o.acos+'%':'—'}</div><div class="k">ACOS</div></div>
  <div class="sc"><div class="v">${o.tacos?o.tacos+'%':'—'}</div><div class="k">TACOS</div></div>
  <div class="sc"><div class="v">${num(o.se26)}</div><div class="k">Sessions '26</div></div>
  <div class="sc"><div class="v">${o.scvr!=null?o.scvr+'%':'—'}</div><div class="k">Session CVR</div></div>
  <div class="sc"><div class="v">${o.acvr!=null?o.acvr+'%':'—'}</div><div class="k">Ad CVR</div></div>
  <div class="sc"><div class="v">${o.yoy==null?'—':(o.yoy>0?'+':'')+o.yoy+'%'}</div><div class="k">YoY Sales</div></div>
  <div class="sc"><div class="v">${o.mom==null?'—':(o.mom>0?'+':'')+o.mom+'%'}</div><div class="k">MoM (Aug/Jul)</div></div>
  <div class="sc"><div class="v">${o.cn||0}</div><div class="k">Campaigns</div></div></div>
 ${o.pf?`<div class="cp"><b>Portfolios:</b> ${o.pf}</div>`:''}${o.cmp?`<div class="cp"><b>Campaigns:</b> ${o.cmp}${o.cn>2?' …':''}</div>`:''}
 <div class="chart"><h4>Total Sales by month</h4><div class="leg"><span style="background:#b7c4d9"></span>2025 &nbsp; <span style="background:#1c7293"></span>2026</div>${bar(o)}</div></div>`;
 window.scrollTo({top:0,behavior:'smooth'});}
q.addEventListener('input',search);q.addEventListener('keydown',e=>{if(e.key=='Enter'){const t=q.value.trim().toUpperCase();if(idx[t])show(t);}});
// batch
document.getElementById('bq').addEventListener('input',function(){
 const ids=[...new Set(this.value.toUpperCase().split(/[^A-Z0-9]+/).filter(x=>x.length>=8))];
 if(!ids.length){document.getElementById('btable').innerHTML='';return;}
 let rows=ids.map(id=>{const o=idx[id];if(!o)return `<tr><td>${id}</td><td colspan="7" style="color:#c92a2a">not found</td></tr>`;
   return `<tr onclick="tab(1);document.getElementById('q').value='${o.a}';show('${o.a}')"><td style="font-family:monospace;font-weight:700">${o.a}</td><td>${o.c}</td><td><span class="chip ${bclass(o.b)}">${o.b}</span>${o.m?' <span class="chip mixchip">MIX</span>':''}</td><td><b>${V(o)}</b></td><td style="font-size:11px">${o.rc||''}</td><td>${money(o.ts26)}</td><td>${money(o.sp)}</td><td>${o.roas?o.roas+'x':'—'}</td></tr>`;}).join('');
 document.getElementById('btable').innerHTML=`<table><thead><tr><th>ASIN</th><th>Category</th><th>Badge</th><th>Verdict</th><th>Reason codes</th><th>T.Sales'26</th><th>Spend'26</th><th>ROAS</th></tr></thead><tbody>${rows}</tbody></table><div class="hint">${ids.length} ASINs · click a row for the full card</div>`;
});
</script></body></html>
